name: Unrequest Copilot on fork pull requests

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested

permissions:
  pull-requests: write

jobs:
  unrequest-copilot:
    if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove Copilot as requested reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.removeRequestedReviewers({
                owner,
                repo,
                pull_number,
                reviewers: ["Copilot"],
              });
              core.info(`Removed Copilot reviewer request for PR #${pull_number}.`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                core.info("Copilot was not currently requested on this PR.");
                return;
              }
              throw error;
            }
